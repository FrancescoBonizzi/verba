name: PR - Swift

on:
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  # Not filtered by path: a required check that is skipped stays pending and blocks the merge.
  swift:
    name: "PR - Swift: lint, test, build"
    # NOTE: the only GitHub image with the macOS 27 SDK, still a public preview; its default Xcode is 27.
    # https://github.com/actions/runner-images/issues/14404
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Lint
        run: swift format lint --strict --recursive --configuration .swift-format Packages App

      - name: Test VerbaKit
        working-directory: Packages/VerbaKit
        run: swift test

      - name: Build the app
        # Unsigned: CI only proves the app compiles. Signing belongs to the release workflow, the only place
        # allowed to read the signing key.
        run: >-
          xcodebuild -project App/Verba.xcodeproj -scheme Verba -configuration Release
          -destination 'platform=macOS' CODE_SIGNING_ALLOWED=NO build
