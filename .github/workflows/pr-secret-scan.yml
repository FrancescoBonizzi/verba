name: PR - Secret scan

on:
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  secret-scan:
    name: "PR - Secret scan: TruffleHog"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The whole history, to diff the PR's base..head.
          fetch-depth: 0
          persist-credentials: false

      # GitHub's push protection already blocks known provider tokens at push time; TruffleHog adds its
      # own detectors and also covers commits pushed before protection was on.
      - name: Run TruffleHog
        # WARNING: the SHA pins only the action's wrapper: it runs ghcr.io/trufflesecurity/trufflehog:latest.
        # Deliberate: a secret scanner's detectors age badly, and the price is an upstream image entering CI
        # without review.
        uses: trufflesecurity/trufflehog@3bd2b5887eb0efb8fa18bfd1d296032924e4ffdc # v3.99.9
        with:
          base: ${{ github.event.pull_request.base.sha }}
          head: ${{ github.event.pull_request.head.sha }}
          # verified = confirmed live secrets, unknown = could not be verified; "unverified" is left out to
          # keep false positives down.
          extra_args: --results=verified,unknown
