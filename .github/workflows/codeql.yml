name: CodeQL

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  schedule:
    # Weekly, so new CodeQL queries also run on code nobody is touching.
    - cron: "17 4 * * 1"

permissions: {}

jobs:
  analyze:
    name: "CodeQL: ${{ matrix.language }}"
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: actions
            runner: ubuntu-latest
            build-mode: none
          # Swift needs the macOS 27 SDK: the same preview image as the Swift PR check.
          - language: swift
            runner: xcode-27
            build-mode: manual
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          queries: security-extended

      - name: Build Swift code
        if: matrix.build-mode == 'manual'
        run: |
          (cd Packages/VerbaKit && swift build)
          xcodebuild -project App/Verba.xcodeproj -scheme Verba -configuration Debug \
            -destination 'platform=macOS' CODE_SIGNING_ALLOWED=NO build

      - uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          category: "/language:${{ matrix.language }}"
