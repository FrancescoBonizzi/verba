name: CodeQL

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  schedule:
    # Weekly, so new CodeQL queries also run on code nobody is touching.
    - cron: "17 4 * * 1"

permissions: {}

jobs:
  analyze:
    name: "CodeQL: ${{ matrix.language }}"
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        # Swift joins this matrix (on a macOS runner, with a build step) in the PR that adds the first
        # Swift code: CodeQL fails on a language with no source.
        language: ["actions"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: ${{ matrix.language }}
          queries: security-extended

      - uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          category: "/language:${{ matrix.language }}"
