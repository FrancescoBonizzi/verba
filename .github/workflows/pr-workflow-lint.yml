name: PR - Workflow lint

on:
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  # Not filtered by path: a required check that is skipped stays pending and blocks the merge. Both tools
  # take seconds.
  actionlint:
    name: "PR - Workflow lint: actionlint"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install actionlint (checksum verified)
        env:
          VERSION: "1.7.12"
          SHA256: "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8"
        run: |
          curl -fsSL -o actionlint.tar.gz "https://github.com/rhysd/actionlint/releases/download/v${VERSION}/actionlint_${VERSION}_linux_amd64.tar.gz"
          echo "${SHA256}  actionlint.tar.gz" | sha256sum -c -
          tar -xzf actionlint.tar.gz actionlint

      - name: Run actionlint
        run: ./actionlint -color

  zizmor:
    name: "PR - Workflow lint: zizmor"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: zizmorcore/zizmor-action@45d7276c9ca790aabd705e31ca99c6185c3e76dd # v0.8.1
        with:
          # Fail the job on findings instead of uploading SARIF: the result shows on the PR, and the job
          # needs no security-events permission.
          advanced-security: false
