version: 2
updates:
  # The "swift" ecosystem is added in the PR that creates Packages/VerbaKit: Dependabot errors on a
  # directory without a manifest.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    # A just-published release is where a hijacked action shows up; a week lets others notice first.
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: "ci"
